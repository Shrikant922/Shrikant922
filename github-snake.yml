name: Generate Snake Animation

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Shrikant922
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff2d6a
            dist/github-snake-light.svg?palette=github-light&color_snake=#7c2fd1
            dist/github-snake.gif?color_snake=#9b30ff&color_dots=#241033,#3a2050,#7b2ff7,#ff2d6a,#ffd9e2

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
